@if (course$ | async; as course) {
  <div class="layout-container">
    <header class="master-header">
      <div class="header-left">
        <a routerLink="/courses" class="back-nav-btn" aria-label="Back to Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <h1 class="course-title">{{ course.title }}</h1>
        <span class="role-badge" [class]="course.currentUserRole.toLowerCase()">
          {{ course.currentUserRole }}
        </span>
      </div>
    </header>

    <nav class="course-tabs">
      <a [routerLink]="['/courses', course.id, 'syllabus']" routerLinkActive="active">Syllabus</a>
      <a [routerLink]="['/courses', course.id, 'people']" routerLinkActive="active">People</a>

      <a routerLink="/messages" [state]="{ expandCourseId: course.id }">Chat</a>

      @if (course.currentUserRole === CourseRole.TEACHER) {
        <a [routerLink]="['/courses', course.id, 'settings']" routerLinkActive="active">Settings</a>
      }
    </nav>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <div class="loading-overlay">
    <div class="spinner"></div>
    <span>Authenticating Course Access...</span>
  </div>
}
